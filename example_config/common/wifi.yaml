# https://esphome.io/components/wifi.html?highlight=wifi%20connected#wifi-connected-condition
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light  # High | NONE
  #use_address: $ip
  fast_connect: true
  #reboot_timeout: 0s # Disable reboots for when Home Assistant is offline for an extended time.
  
  manual_ip:
    static_ip: $static_ip
    gateway: 192.168.178.1
    subnet: 255.255.255.0    
    dns1: 192.168.178.1

  # Enable fallback Hotspot (requires "captive_portal:")  in case wifi connection fails
  ap:
    ssid: "$hostname Fallback"
    password: !secret failover_password

captive_portal:
